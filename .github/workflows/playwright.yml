
name: Playwright Tests

"on":
  # Run on push
  push:
    branches: [main, master]

  # Run on pull request
  pull_request:
    branches: [main, master]

  # Run daily at 9:30 AM IST (04:00 UTC)
  schedule:
    - cron: "7 4 * * *" 

  # Allow manual execution
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 120
    runs-on: ubuntu-latest

    env:
      CI: "true"
      HEADLESS: "true"
      BASE_URL: ${{ vars.BASE_URL || 'https://gctp.in' }}
      CMS_BASE_URL: ${{ vars.CMS_BASE_URL || secrets.CMS_BASE_URL || 'https://cms.gctp.in/' }}
      CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Java for Allure
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Verify Allure reporter
      - name: Verify Allure dependency
        run: npm ls allure-playwright

      # 6. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 7. Clean previous reports
      - name: Clean Previous Reports
        shell: bash
        run: |
          rm -rf allure-results allure-report
          rm -rf test-results playwright-report
          rm -f tests/bug-reports/Automation_Bug_Report.xlsx

          mkdir -p allure-results
          mkdir -p tests/bug-reports

          echo "Previous reports cleared successfully."

      # 8. Validate CI configuration and target reachability
      - name: Validate configuration and endpoint reachability
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CMS_USERNAME:-}" || { echo "::error::Missing CMS_USERNAME secret."; exit 1; }
          test -n "${CMS_PASSWORD:-}" || { echo "::error::Missing CMS_PASSWORD secret."; exit 1; }

          cms_url="${CMS_BASE_URL%/}/"
          public_url="${BASE_URL%/}/chennai-home"

          echo "Using CMS_BASE_URL=${cms_url}"
          echo "Using BASE_URL=${BASE_URL}"

          cms_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 --connect-timeout 10 "${cms_url}" || true)"
          test "${cms_status}" != "000" || { echo "::error::CMS endpoint is unreachable: ${cms_url}"; exit 1; }
          echo "CMS endpoint is reachable (HTTP ${cms_status})."

          public_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 --connect-timeout 10 "${public_url}" || true)"
          test "${public_status}" != "000" || { echo "::error::Public endpoint is unreachable: ${public_url}"; exit 1; }
          echo "Public endpoint is reachable (HTTP ${public_status})."

      # 9. Run Playwright tests
      # Excludes tests tagged @manual
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "@manual"

      # 10. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && \
             [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npx --yes allure-commandline@2.34.1 generate \
              allure-results \
              --clean \
              -o allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi

      # 11. Upload Allure raw results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      # 12. Upload Allure HTML report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      # 13. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # 14. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      # 15. Upload Excel bug report
      - name: Upload Excel Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Bug-Report
          path: tests/bug-reports/Automation_Bug_Report.xlsx
          if-no-files-found: warn
          retention-days: 14