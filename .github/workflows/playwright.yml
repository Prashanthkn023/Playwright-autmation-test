name: Playwright Tests

"on":
  # Run on push
  push:
    branches: [main, master]

  # Run on pull request
  pull_request:
    branches: [main, master]

  # Run daily at 9:30 AM IST (04:00 UTC)
  schedule:
    - cron: "0 4 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Java for Allure
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 6. Clean previous reports
      - name: Clean Previous Reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf test-results
          rm -rf playwright-report
          rm -f tests/bug-reports/Automation_Bug_Report.xlsx

          mkdir -p allure-results
          mkdir -p tests/bug-reports

          echo "Previous reports cleared successfully."

      # 7. Run Playwright tests
      # Excludes tests tagged @manual
      - name: Run Playwright tests
        env:
          CI: "true"
          HEADLESS: "true"
          CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
          CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
        run: npx playwright test --grep-invert "@manual"

      # 8. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: always()
        run: |
          if [ -d "allure-results" ] && \
             [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npx --yes allure-commandline@2.34.1 generate \
              allure-results \
              --clean \
              -o allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi

      # 9. Upload Allure raw results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      # 10. Upload Allure HTML report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      # 11. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # 12. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 13. Upload Excel bug report
      - name: Upload Excel Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Bug-Report
          path: tests/bug-reports/Automation_Bug_Report.xlsx
          if-no-files-found: ignore
          retention-days: 14