name: Playwright Tests

"on":
  # Run on push
  push:
    branches: [main, master]

  # Run on pull request
  pull_request:
    branches: [main, master]

  # Run every day at 9:30 AM IST
  # 9:30 AM IST = 04:00 UTC
  schedule:
    - cron: "30 9 * * *"

  # Allow manual execution
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60

    # GitHub-hosted runner
    runs-on: ubuntu-latest

    env:
      # GitHub Variables
      BASE_URL: ${{ vars.BASE_URL }}
      GCTP_BASE_URL: ${{ vars.GCTP_BASE_URL }}
      CMS_MODULE_URL: ${{ vars.CMS_MODULE_URL }}
      CMS_BASE_URL: ${{ vars.CMS_BASE_URL }}

      GEMINI_AGENT: ${{ vars.GEMINI_AGENT }}

      BROWSER: ${{ vars.BROWSER }}
      TIMEOUT: ${{ vars.TIMEOUT }}
      CAPTCHA_WAIT: ${{ vars.CAPTCHA_WAIT }}
      OTP_WAIT: ${{ vars.OTP_WAIT }}

      # GitHub Secrets
      CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      CI: "true"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Java for Allure
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Verify Allure dependency
      - name: Verify Allure dependency
        run: npm ls allure-playwright

      # 6. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 6.5. Network Diagnostics (TEMPORARY - for debugging ECONNREFUSED)
      - name: Network Diagnostics
        shell: bash
        run: |
          set +e  # Allow commands to fail without exiting the script

          echo "=========================================="
          echo "NETWORK DIAGNOSTICS FOR GCTP/CMS"
          echo "=========================================="
          echo ""

          echo "=== 1. PROXY ENVIRONMENT VARIABLES ==="
          env | grep -i proxy || echo "No proxy variables set"
          echo ""

          echo "=== 2. DNS RESOLUTION - gctp.in ==="
          nslookup gctp.in 8.8.8.8 || echo "DNS resolution failed for gctp.in"
          echo ""

          echo "=== 3. DNS RESOLUTION - cms.gctp.in ==="
          nslookup cms.gctp.in 8.8.8.8 || echo "DNS resolution failed for cms.gctp.in"
          echo ""

          echo "=== 4. HTTPS HEAD REQUEST - gctp.in ==="
          curl -I --connect-timeout 10 --max-time 30 https://gctp.in 2>&1 || echo "HTTPS connection failed to gctp.in"
          echo ""

          echo "=== 5. HTTPS HEAD REQUEST - cms.gctp.in ==="
          curl -I --connect-timeout 10 --max-time 30 https://cms.gctp.in 2>&1 || echo "HTTPS connection failed to cms.gctp.in"
          echo ""

          echo "=== 6. HTTPS HEAD REQUEST - CMS API (home-page) ==="
          curl -I --connect-timeout 10 --max-time 30 \
            -H "Accept: application/json" \
            'https://cms.gctp.in/api/fusion-cms-web-backend/home-page?approvalStatus=all' 2>&1 \
            || echo "HTTPS connection failed to CMS API"
          echo ""

          echo "=== 7. HTTPS HEAD REQUEST - GCTP API (home-page) ==="
          curl -I --connect-timeout 10 --max-time 30 \
            -H "Accept: application/json" \
            'https://gctp.in/api/fusion-public-facing-web-backend/home-page' 2>&1 \
            || echo "HTTPS connection failed to GCTP API"
          echo ""

          echo "=== 8. VERBOSE HTTPS CONNECTION - cms.gctp.in ==="
          (curl -v --connect-timeout 10 --max-time 30 https://cms.gctp.in 2>&1 | head -50) || echo "Verbose curl failed or timed out"
          echo ""

          echo "=== 9. TCP CONNECTIVITY TEST - cms.gctp.in:443 ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/cms.gctp.in/443' && echo "TCP connection successful" || echo "TCP connection failed (ECONNREFUSED or timeout)"
          echo ""

          echo "=== 10. TCP CONNECTIVITY TEST - gctp.in:443 ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/gctp.in/443' && echo "TCP connection successful" || echo "TCP connection failed (ECONNREFUSED or timeout)"
          echo ""

          echo "=== 11. GITHUB RUNNER PUBLIC IP ==="
          curl -s --connect-timeout 10 --max-time 15 https://api.ipify.org || echo "Cannot determine public IP"
          echo ""

          echo "=========================================="
          echo "DIAGNOSTICS COMPLETE"
          echo "=========================================="

          exit 0  # Always exit successfully to not block the workflow

      # 7. Clean previous reports
      - name: Clean Previous Reports
        shell: bash
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf test-results
          rm -rf playwright-report
          rm -rf tests/bug-reports

          mkdir -p allure-results
          mkdir -p tests/bug-reports

          echo "Previous reports cleared successfully."

      # 8. Run Playwright tests
      # Excludes tests tagged @manual
      - name: Run Playwright Tests
        run: npx playwright test --grep-invert "@manual"

      # 9. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && \
             [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            echo "Generating Allure report..."

            npx --yes allure-commandline@2.34.1 generate \
              allure-results \
              --clean \
              -o allure-report

            echo "Allure report generated successfully."

          else
            echo "No Allure results found."
          fi

      # 10. Upload Allure raw results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      # 11. Upload Allure HTML report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      # 12. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # 13. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      # 14. Upload Excel Bug Report
      - name: Upload Excel Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Bug-Report
          path: tests/bug-reports/*.xlsx
          if-no-files-found: warn
          retention-days: 14