name: Playwright Tests

"on":
  # Run on push
  push:
    branches: [main, master]

  # Run on pull request
  pull_request:
    branches: [main, master]

  # Run daily at 9:30 AM IST (04:00 UTC)
  schedule:
    - cron: "0 4 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 120

    # Use your Windows self-hosted runner
    runs-on: [self-hosted, Windows, X64]

    env:
      CI: "true"
      HEADLESS: "true"
      WORKERS: "1"

      CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      BASE_URL: https://gctp.in
      CMS_BASE_URL: https://cms.gctp.in/

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Java for Allure
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Verify Allure reporter
      - name: Verify Allure dependency
        run: npm ls allure-playwright

      # 6. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # 7. Clean previous reports
      - name: Clean Previous Reports
        shell: pwsh
        run: |
          $folders = @(
            "allure-results",
            "allure-report",
            "test-results",
            "playwright-report",
            "tests/bug-reports"
          )

          foreach ($folder in $folders) {
            if (Test-Path $folder) {
              Remove-Item $folder -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Force -Path "allure-results" | Out-Null
          New-Item -ItemType Directory -Force -Path "tests/bug-reports" | Out-Null

          Write-Host "Previous reports cleared successfully."

      # 8. Run Playwright tests, excluding manual tests
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "@manual"

      # 9. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: always()
        shell: pwsh
        run: |
          $results = Get-ChildItem "allure-results" -File -Recurse -ErrorAction SilentlyContinue

          if ($results.Count -gt 0) {
            npx --yes allure-commandline@2.34.1 generate allure-results --clean -o allure-report

            if ($LASTEXITCODE -ne 0) {
              throw "Allure report generation failed."
            }
          }
          else {
            Write-Host "No Allure results found. Skipping report generation."
          }

      # 10. Upload Allure raw results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      # 11. Upload Allure HTML report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      # 12. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # 13. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      # 14. Upload Excel bug report
      - name: Upload Excel Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Bug-Report
          path: tests/bug-reports/*.xlsx
          if-no-files-found: warn
          retention-days: 14
