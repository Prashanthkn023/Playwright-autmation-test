        - generic [ref=f2e51]: Message From Commissioner Of Police
        - paragraph [ref=f2e53]:
          - paragraph [ref=f2e54]: "Dear Citizens of Chennai Road safety is a shared responsibility. Every day, thousands of vehicles move across our city's roads, and it is our collective duty to ensure that these roads remain safe for everyone. As the Commissioner of Police, I urge all road users to practice discipline, patience, and caution when driving or commuting. Here are a few critical reminders: Follow Traffic Rules: Always adhere to traffic signals, speed limits, and road signs. These rules are in place to ensure smooth and safe traffic flow. Avoid Using Mobile Phones: Using a mobile phone while driving, even for a few seconds, can result in disastrous consequences. Stay focused on the road. Wear Helmets and Seatbelts: Helmets for two-wheeler riders and seatbelts for car occupants are essential for your safety. Please ensure they are always used properly. Respect Pedestrians: Always yield to pedestrians at crosswalks and be mindful of their right of way. Pedestrians are an integral part of our traffic system. Do Not Drink and Drive: Driving under the influence is one of the leading causes of fatal accidents. If you consume alcohol, ensure you have a designated driver or use public transportation. Avoid Over speeding and Rash Driving: Speed thrills, but it also kills. Stay within the prescribed speed limits and drive responsibly to protect yourself and others. Use Public Transport and Carpooling: To reduce congestion and pollution, consider using public transportation or carpooling whenever possible. Thank you for your cooperation."
        - paragraph [ref=f2e55]: Thiru Dr. A. Amalraj, IPS, Commissioner of Police
