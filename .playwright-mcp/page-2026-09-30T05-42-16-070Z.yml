      - generic [ref=f2e356]: காவல்துறை ஆணையரின் செய்தி-போக்குவரத்து
      - paragraph [ref=f2e358]:
        - paragraph [ref=f2e359]: "அன்புடைய சென்னை மக்களே,சாலைப் பாதுகாப்பு என்பது அனைவரும் பகிர்ந்து கொள்ள வேண்டிய பொது பொறுப்பாகும். நாள்தோறும் ஆயிரக்கணக்கான வாகனங்கள் நமது நகரின் சாலைகளில் இயக்கப்படுகின்றன; அவை ஒவ்வொருவருக்கும் பாதுகாப்பாக இருக்க வேண்டும் என்பதைக் காவல் துறையினரும், பொதுமக்களும் உறுதி செய்ய வேண்டியது கடமையாகும். சென்னை காவல் ஆணையராகிய நான், அனைத்து சாலைப் பயனாளர்களும் ஒழுக்கம், பொறுமை மற்றும் எச்சரிக்கையுடன் பயணிக்குமாறு கேட்டுக்கொள்கிறேன். இங்கே சில முக்கியமான நினைவூட்டல்கள்: போக்குவரத்து விதிகளைப் பின்பற்றுங்கள்: எப்போதும் போக்குவரத்து சிக்னல்கள், வேக வரம்புகள் மற்றும் சாலைச் சின்னங்களைப் பின்பற்றுங்கள். இவ்விதிகள் சீரான போக்குவரத்து ஓட்டத்திற்கும், அனைவரின் பாதுகாப்பிற்கும் அமைக்கப்பட்டுள்ளன.அலைபேசியை பயன்படுத்த வேண்டாம்: வாகனம் ஓட்டிக் கொண்டிருக்கும் போது சில விநாடிகளுக்குக் கூட அலைபேசியை பயன்படுத்துவது பெரும் விபத்துகளுக்குக் காரணமாக முடியும். உங்கள் கவனத்தை சாலையிலேயே வைத்துக் கொள்ளுங்கள்.தலைக்கவசம் மற்றும் இருக்கைப்பட்டை அணியுங்கள்: இருசக்கர வாகன பயணிகளுக்கு தலைக்கவசம், காரில் பயணிக்கும் அனைவருக்கும் இருக்கைப்பட்டை அ"
