      - generic [ref=f2e51]: காவல்துறை ஆணையரின் செய்தி-போக்குவரத்து
      - paragraph [ref=f2e53]:
        - paragraph [ref=f2e54]: "அன்புடைய சென்னை மக்களே,சாலைப் பாதுகாப்பு என்பது அனைவரும் பகிர்ந்து கொள்ள வேண்டிய பொது பொறுப்பாகும். நாள்தோறும் ஆயிரக்கணக்கான வாகனங்கள் நமது நகரின் சாலைகளில் இயக்கப்படுகின்றன; அவை ஒவ்வொருவருக்கும் பாதுகாப்பாக இருக்க வேண்டும் என்பதைக் காவல் துறையினரும், பொதுமக்களும் உறுதி செய்ய வேண்டியது கடமையாகும். சென்னை காவல் ஆணையராகிய நான், அனைத்து சாலைப் பயனாளர்களும் ஒழுக்கம், பொறுமை மற்றும் எச்சரிக்கையுடன் பயணிக்குமாறு கேட்டுக்கொள்கிறேன். இங்கே சில முக்கியமான நினைவூட்டல்கள்: போக்குவரத்து விதிகளைப் பின்பற்றுங்கள்: எப்போதும் போக்குவரத்து சிக்னல்கள், வேக வரம்புகள் மற்றும் சாலைச் சின்னங்களைப் பின்பற்றுங்கள். இவ்விதிகள் சீரான போக்குவரத்து ஓட்டத்திற்கும், அனைவரின் பாதுகாப்பிற்கும் அமைக்கப்பட்டுள்ளன.அலைபேசியை பயன்படுத்த வேண்டாம்: வாகனம் ஓட்டிக் கொண்டிருக்கும் போது சில விநாடிகளுக்குக் கூட அலைபேசியை பயன்படுத்துவது பெரும் விபத்துகளுக்குக் காரணமாக முடியும். உங்கள் கவனத்தை சாலையிலேயே வைத்துக் கொள்ளுங்கள்.தலைக்கவசம் மற்றும் இருக்கைப்பட்டை அணியுங்கள்: இருசக்கர வாகன பயணிகளுக்கு தலைக்கவசம், காரில் பயணிக்கும் அனைவருக்கும் இருக்கைப்பட்டை அவசியம். அவற்றை எப்போதும் சரியாகப் பயன்படுத்துவதை உறுதி செய்யுங்கள். நடைபயணிகளை மதியுங்கள்: நடைபாதை மற்றும் கடவுச்சாலைகளில் நடைபயணிகளுக்கு முன்னுரிமை அளியுங்கள். அவர்கள் உரிமையை மதித்து செயல்படுங்கள்; நடைபயணிகளும் நமது போக்குவரத்து அமைப்பின் அங்கமாக இருக்கின்றனர்.மது அருந்தி வாகனம் ஓட்ட வேண்டாம்: மதுவின் தாக்கத்தில் வாகனம் ஓட்டுவது பல உயிரிழப்புகளுக்குக் காரணமாகிறது. நீங்கள் மது அருந்தியிருந்தால், ஒருவரை ஓட்டுநராக நியமிக்கவும் அல்லது பொதுப் போக்குவரத்தைப் பயன்படுத்தவும்.அதிக வேகம் மற்றும் அவசரமாக வாகனம் ஓட்டுவதைத் தவிர்க்கவும்: அதிக வேகம் ஆபத்துகள் ஏற்படுத்தக்கூடும். நிர்ணயிக்கப்பட்ட வேக வரம்புக்குள் மட்டுமே வாகனங்களை செலுத்தி, உங்களையும் ற்றவர்களையும் பாதுகாக்க பொறுப்புடன் வாகனம் ஓட்டவும்.பொது போக்குவரத்தையும் 'கார்பூலிங்' முறையையும் பயன்படுத்துங்கள்: சாலை நெரிசல் மற்றும் சுற்றுச்சூழல் மாசுபாட்டை குறைப்பதற்காக பொதுப் போக்குவரத்தையும், பகிர்ந்து பயணிக்கும் முறையையும் பயன்படுத்துங்கள்.உங்கள் ஒத்துழைப்பிற்கு நன்றி.திரு. அ. அருண், (ஐ.பி.எஸ்) சென்னை காவல் ஆணையர்\""
      - paragraph [ref=f2e55]: Thiru Dr. A. Amalraj, IPS, Commissioner of Police
