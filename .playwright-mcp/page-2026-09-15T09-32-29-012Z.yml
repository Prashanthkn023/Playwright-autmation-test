        - generic [ref=f3e355]: கிரேட்டர் சென்னை போக்குவரத்து போலீஸ்.
        - paragraph [ref=f3e357]:
          - paragraph [ref=f3e358]: "1659 ஆம் ஆண்டு, அப்போது \"சென்னை\" \"மதராஸ்\" என அழைக்கப்பட்டு, சில மீனவக் கிராமங்களின் தொகுப்பாக இருந்தபோது, பெத்த நாயக்கர் நகரத்தை பாதுகாக்கப் பியூன்கள் குழுவை அமைத்தார். 1780 ஆம் ஆண்டில், சந்தைகளை நிர்வகிக்க \"சூப்பரிண்டெண்ட் ஆப் போலீஸ்\" என்ற பதவி உருவாக்கப்பட்டது. 1857 இந்திய கிளர்ச்சிக்கு பின், பிரிட்டிஷ் ஆட்சி சீர்திருத்தங்களின் ஒரு பகுதியாக மாட்ராஸ் போலீஸ் அமைப்பை உருவாக்கியது. 1928 ஆம் ஆண்டில், \"இன்ஸ்பெக்டர் ஜெனரல்\" மற்றும் \"கமிஷனர் ஆப் போலீஸ்\" அதிகரித்து வரும் போக்குவரத்து பிரச்சினைகளை சமாளிக்க கூடுதல் பணியாளர்களை அனுமதிக்க அரசு நோக்கி விண்ணப்பித்தனர். ஆனால் அரசாங்கம் தாமதமாக பதிலளித்தது. 1928 ஆம் ஆண்டின் இறுதியில், சென்னை நகரில் போக்குவரத்து தொடர்பான சிக்கல்கள் அதிகரித்திருப்பதை அரசு தெளிவாகக் கண்டபோதிலும், உடனடி நடவடிக்கை எடுக்கவில்லை. இருப்பினும், போக்குவரத்து துறையின் பணியாளர்கள் எண்ணிக்கையை அதிகரித்து, அதை மேம்படுத்த வேண்டிய அவசியத்தை அரசு உணர வேண்டிய நிலை ஏற்பட்டது. இவ்வாறு ஒரு தனி “டிராஃபிக் போலீஸ்” பிரிவை உருவாக்கும் விதை விதைக்கப்பட்டது 1929 ஆம் ஆண்டில், முழு அமைப்பும் மறுசீரமைக்கப்பட்டு, அப்போது சென்னை போலீஸ் கமிஷனராக இருந்த சர் சார்ல்ஸ் கனிங்ஹாம் உருவாக்கிய “செயல்பாட்டு பிரிவு” (Functional Division) முறையில் மாற்றம் செய்யப்பட்டது. 1929 செப்டம்பர் 1 ஆம் தேதி முதல், காவல் துறை மூன்று பிரிவுகளாகப் பிரிக்கப்பட்டது: சட்டம் & ஒழுங்கு (L&O), குற்றம் (Crime), மற்றும் போக்குவரத்து (Traffic). 1929 ஆம் ஆண்டு, சென்னை நகர போக்குவரத்து காவல்துறை வரலாற்றில் ஒரு முக்கிய மைல்கல் ஆக அமைந்தது. அந்நாள்களில் இருந்த பணிமுறை மற்றும் நிலப்பிரிவு முறைகள் மாற்றமடைந்தன."
