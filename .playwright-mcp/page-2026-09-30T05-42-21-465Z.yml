  - generic [ref=f2e441]:
    - generic [ref=f2e448]:
      - generic [ref=f2e449]: கூடுதல் காவல் ஆணையரின் செய்தி-போக்குவரத்து
      - paragraph [ref=f2e451]:
        - paragraph [ref=f2e452]: "அன்புள்ள சென்னை குடிமக்களே, சாலை பாதுகாப்பு என்பது பகிரப்பட்ட பொறுப்பு. ஒவ்வொரு நாளும், ஆயிரக்கணக்கான வாகனங்கள் எங்கள் நகரத்தின் சாலைகளில் செல்கின்றன, மேலும் இந்த சாலைகள் அனைவருக்கும் பாதுகாப்பாக இருப்பதை உறுதி செய்வது எங்கள் கூட்டுக் கடமையாகும். காவல் ஆணையர் என்ற முறையில், வாகனம் ஓட்டும் போது அல்லது பயணத்தின் போது ஒழுக்கம், பொறுமை மற்றும் எச்சரிக்கையுடன் பழகுமாறு அனைத்து சாலைப் பயணிகளையும் கேட்டுக் கொள்கிறேன். சில முக்கியமான நினைவூட்டல்கள் இங்கே: போக்குவரத்து விதிகளை பின்பற்றவும்: போக்குவரத்து சிக்னல்கள், வேக வரம்புகள் மற்றும் சாலை அடையாளங்களை எப்போதும் கடைபிடிக்கவும். சீரான மற்றும் பாதுகாப்பான போக்குவரத்தை உறுதி செய்வதற்காக இந்த விதிகள் உள்ளன. மொபைல் போன்களைப் பயன்படுத்துவதைத் தவிர்க்கவும்: வாகனம் ஓட்டும் போது மொபைல் போனைப் பயன்படுத்தினால், சில நொடிகள் கூட, பேரழிவு விளைவுகளை ஏற்படுத்தலாம். சாலையில் கவனம் செலுத்துங்கள். ஹெல்மெட் மற்றும் சீட் பெல்ட் அணியுங்கள்: இரு சக்கர வாகன ஓட்டிகளுக்கு ஹெல்மெட் மற்றும் காரில் செல்பவர்கள் சீட் பெல்ட் உங்கள் பாதுகாப்பிற்கு அவசியம். அவை எப்போதும் சரியாகப் பயன்படுத்தப்படுவதை உறுதிப்படுத்திக் கொள்ளவும். பாதசாரிகளை மதிக்கவும்: குறுக்குவழிகளில் எப்போதும் பாதசாரிகளுக்கு அடிபணியுங்கள் மற்றும் அவர்களின் உரிமையை கவனத்தில் கொள்ளுங்கள். பாதசாரிகள் எங்கள் போக்குவரத்து அமைப்பின் ஒருங்கிணைந்த பகுதியாகும். மது அருந்திவிட்டு வாகனம் ஓட்டாதீர்கள்: போதையில் வாகனம் ஓட்டுவது விபத்துக்களுக்கு முக்கிய காரணங்களில் ஒன்றாகும். நீங்கள் மது அருந்தினால், உங்களிடம் நியமிக்கப்பட்ட ஓட்டுனர் இருப்பதை உறுதிப்படுத்தவும் அல்லது பொது போக்குவரத்தைப் பயன்படுத்தவும். அதிக வேகம் மற்றும் அவசரமாக வாகனம் ஓட்டுவதைத் தவிர்க்கவும்: வேகம் சிலிர்க்க வைக்கிறது, ஆனால் அது கொல்லும். பரிந்துரைக்கப்பட்ட வேக வரம்புகளுக்குள் இருங்கள் மற்றும் உங்களையும் மற்றவர்களையும் பாதுகாக்க பொறுப்புடன் வாகனம் ஓட்டவும். பொதுப் போக்குவரத்து மற்றும் கார்பூலிங் பயன்படுத்தவும்: நெரிசல் மற்றும் மாசுபாட்டைக் குறைக்க, முடிந்தவரை பொதுப் போக்குவரத்து அல்லது கார்பூலிங்கைப் பயன்படுத்தவும்."
