          - generic [ref=f1e77]: Greater Chennai Traffic Police
          - paragraph [ref=f1e79]:
            - paragraph [ref=f1e80]: In 1659, when Chennai (then called Madras) was just a group of fishing villages, Pedda Naik formed a group of peons to guard the town. By 1780 the post of Superintendent of Police was created to manage the markets. After the Indian Rebellion of 1857, the British Raj in India formed the modern Madras Police as part of its reforms. In the due course the Government had to realize the need of improving the Traffic Department by increasing its staff strength. Thus a seed was sown for creating a separate 'Traffic' Police. In the year 1929, the entire organization was recast and remodeled on 'Functional Division' as designed by Sir Charles Cunningham, the then Commissioner of Police. With effect from 1st September 1929, Policing was divided into three divisions namely L&O, Crime and Traffic. The year 1929 is a landmark in the history of Madras City Traffic Police. As the prevailing system of work and the territorial division.
