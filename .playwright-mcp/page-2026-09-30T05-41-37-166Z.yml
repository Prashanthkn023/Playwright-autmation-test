      - paragraph [ref=f1e74]:
        - paragraph [ref=f1e75]: "Dear Citizens of Chennai Road safety is a shared responsibility. Every day, thousands of vehicles move across our city's roads, and it is our collective duty to ensure that these roads remain safe for everyone. As the Commissioner of Police, I urge all road users to practice discipline, patience, and caution when driving or commuting. Here are a few critical reminders: Follow Traffic Rules: Always adhere to traffic signals, speed limits, and road signs. These rules are in place to ensure smooth and safe traffic flow. Avoid Using Mobile Phones: Using a mobile phone while driving, even for a few seconds, can result in disastrous consequences. Stay focused on the road. Wear Helmets and Seatbelts: Helmets for two-wheeler riders and seatbelts for car occupants are essential for your safety. Please ensure they are always used properly. Respect Pedestrians: Always yield to pedestrians at crosswalks and be mindful of their right of way. Pedestrians are an integral part of our traffic system. Do Not Drink an"
